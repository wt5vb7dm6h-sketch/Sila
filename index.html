<!DOCTYPE html>
<html>
<head>
<title>Private 💌</title>
<style>
body{
  text-align:center;
  font-family:Arial;
  background:linear-gradient(to right,#ffd6e7,#ffe6f0);
  margin-top:120px;
}
input{
  padding:10px;
  border-radius:10px;
  border:none;
}
button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff66b2;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>Only For My Love 💖</h2>
<p>Enter our special date 🔐</p>

<input type="password" id="password">
<button onclick="checkPassword()">Enter</button>

<p id="error" style="color:red;"></p>

<script>
function checkPassword(){
  var pass=document.getElementById("password").value;
  if(pass==="0505"){   // BURAYI DEĞİŞTİR
    window.location.href="index.html";
  }else{
    document.getElementById("error").innerHTML="Wrong password 😿";
  }
}
</script>

</body>
</html>
